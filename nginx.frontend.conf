server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /legacy {
        return 301 /legacy/;
    }

    location /legacy/ {
        try_files $uri $uri/ =404;
    }

    location /api/ {
        proxy_pass http://gateway:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Gateway uses the first forwarded address for anonymous Redis rate-limit
        # keys. Replace, rather than append, any client-supplied value.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass http://gateway:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        # Keep the HTTP and WebSocket forwarding boundary identical.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
