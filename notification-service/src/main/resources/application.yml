server:
  port: 8082
spring:
  application:
    name: campuslink-notification-service
  config:
    import: optional:nacos:${spring.application.name}.yaml?group=${NACOS_GROUP:CAMPUSLINK_DEV}&refreshEnabled=true
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      discovery:
        enabled: ${NACOS_ENABLED:false}
        group: ${NACOS_GROUP:CAMPUSLINK_DEV}
        health-indicator:
          enabled: true
      config:
        enabled: ${NACOS_ENABLED:false}
        group: ${NACOS_GROUP:CAMPUSLINK_DEV}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/campuslink?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${SPRING_DATASOURCE_USERNAME:campuslink}
    password: ${SPRING_DATASOURCE_PASSWORD:campuslink123}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9094}
    admin:
      fail-fast: true
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.campuslink.notification.eventing
        spring.json.value.default.type: com.campuslink.notification.eventing.ActivityRegistrationMessage
        spring.json.use.type.headers: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
mybatis:
  configuration:
    map-underscore-to-camel-case: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://127.0.0.1:4318/v1/traces}
campuslink:
  security:
    jwt:
      secret: ${CAMPUSLINK_JWT_SECRET:campuslink-demo-signing-secret-change-in-production-2026}
  eventing:
    activity-topic: campuslink.activity.events.v1
    activity-dead-letter-topic: campuslink.activity.events.v1.DLT
    activity-notification-delivery-topic: campuslink.activity.notification.delivery.v1
    consumer-retry-delay-ms: 1000
    consumer-max-attempts: 3
