name: Verify CampusLink

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: campuslink
          MYSQL_USER: campuslink
          MYSQL_PASSWORD: campuslink123
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Run frontend checks
        run: |
          bash ./script/run_frontend_check.sh
          cd frontend-vue
          npm ci
          npm test -- --run
          npm run build

      - name: Initialize the CI database
        run: |
          mysql_container="$(docker ps --filter 'ancestor=mysql:8.4' --format '{{.ID}}')"
          test -n "$mysql_container"
          docker exec -i "$mysql_container" mysql --default-character-set=utf8mb4 \
            -ucampuslink -pcampuslink123 campuslink \
            < backend/src/main/resources/schema.sql
          docker exec -i "$mysql_container" mysql --default-character-set=utf8mb4 \
            -ucampuslink -pcampuslink123 campuslink \
            < backend/src/main/resources/data.sql

      - name: Run backend tests
        run: >-
          mvn -f backend/pom.xml
          -DargLine=-javaagent:${HOME}/.m2/repository/net/bytebuddy/byte-buddy-agent/1.17.5/byte-buddy-agent-1.17.5.jar
          test

      - name: Run extracted service tests
        run: |
          mvn -f activity-service/pom.xml test
          mvn -f notification-service/pom.xml test
          mvn -f gateway/pom.xml test

  compose-demo:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Start the Compose demo
        run: docker compose up --build --wait

      - name: Check the gateway API health endpoint
        run: curl --fail --silent http://127.0.0.1:8081/api/database/health

      - name: Check Nacos registration and centralized configuration
        run: |
          for service_name in campuslink-api campuslink-gateway campuslink-activity-service campuslink-notification-service; do
            curl --fail --silent \
              "http://127.0.0.1:8848/nacos/v3/client/ns/instance/list?serviceName=${service_name}&groupName=CAMPUSLINK_DEV" \
              | jq -e '.code == 0 and ([.data[] | select(.healthy == true)] | length) >= 1'
          done
          curl --fail --silent \
            'http://127.0.0.1:8848/nacos/v3/client/cs/config?dataId=campuslink-gateway.yaml&groupName=CAMPUSLINK_DEV' \
            | jq -r '.data.content' \
            | grep --fixed-strings 'config-version: "2026.07.26.1"'

      - name: Check Prometheus operational targets
        run: |
          curl --fail --silent http://127.0.0.1:9090/api/v1/targets \
            | jq -e '[.data.activeTargets[] | select(.health == "up")] | length >= 5'
          curl --fail --silent --get \
            --data-urlencode 'query=count(http_server_requests_seconds_bucket)' \
            http://127.0.0.1:9090/api/v1/query \
            | jq -e '.data.result[0].value[1] | tonumber > 0'

      - name: Stop the Compose demo
        if: always()
        run: docker compose down
