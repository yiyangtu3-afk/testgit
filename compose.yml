name: campuslink

services:
  nacos:
    image: nacos/nacos-server:v3.0.3-slim
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      NACOS_AUTH_ADMIN_ENABLE: "false"
      NACOS_AUTH_CONSOLE_ENABLE: "false"
      NACOS_AUTH_TOKEN: VGhpc0lzQ2FtcHVzTGlua05hY29zRGV2VG9rZW5Gb3JMb2NhbERlbW9Pbmx5
      NACOS_AUTH_IDENTITY_KEY: campuslink
      NACOS_AUTH_IDENTITY_VALUE: campuslink-dev-only
      JVM_XMS: 256m
      JVM_XMX: 512m
      JVM_XMN: 128m
    ports:
      - "127.0.0.1:8088:8080"
      - "127.0.0.1:8848:8848"
    healthcheck:
      test:
        ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8848/nacos/v3/admin/core/state/readiness > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 210s

  nacos-config:
    image: curlimages/curl:8.12.1
    volumes:
      - ./nacos-config:/config:ro
    environment:
      NACOS_SERVER_URL: http://nacos:8848
      NACOS_GROUP: CAMPUSLINK_DEV
    entrypoint: ["/bin/sh", "/config/publish-config.sh"]
    depends_on:
      nacos:
        condition: service_healthy

  kafka:
    image: apache/kafka:3.9.0
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    ports:
      - "127.0.0.1:9094:9094"
    volumes:
      - campuslink-kafka:/var/lib/kafka/data
    healthcheck:
      test:
        ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: campuslink
      MYSQL_USER: campuslink
      MYSQL_PASSWORD: campuslink123
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - campuslink-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  redis:
    image: redis:7.4.2-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s

  api:
    build:
      context: ./backend
    environment:
      SPRING_DATASOURCE_URL: >-
        jdbc:mysql://mysql:3306/campuslink?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: campuslink
      SPRING_DATASOURCE_PASSWORD: campuslink123
      SPRING_PROFILES_ACTIVE: eventing
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CAMPUSLINK_EVENTING_NOTIFICATION_PROJECTION_ENABLED: "false"
      NACOS_ENABLED: "true"
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_GROUP: CAMPUSLINK_DEV
      MANAGEMENT_SERVER_PORT: 8085
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    depends_on:
      nacos-config:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      mysql:
        condition: service_healthy
    ports:
      - "127.0.0.1:${CAMPUSLINK_API_HOST_PORT:-8080}:8080"
    healthcheck:
      test:
        ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8080/api/database/health > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  notification-service:
    build:
      context: ./notification-service
    environment:
      SPRING_DATASOURCE_URL: >-
        jdbc:mysql://mysql:3306/campuslink?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: campuslink
      SPRING_DATASOURCE_PASSWORD: campuslink123
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      NACOS_ENABLED: "true"
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_GROUP: CAMPUSLINK_DEV
      MANAGEMENT_SERVER_PORT: 8087
      MANAGEMENT_SERVER_ADDRESS: 0.0.0.0
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    depends_on:
      nacos-config:
        condition: service_completed_successfully
      api:
        condition: service_healthy
      kafka:
        condition: service_healthy
      mysql:
        condition: service_healthy
    ports:
      - "127.0.0.1:8082:8082"
    healthcheck:
      test:
        ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8087/actuator/health > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  activity-service:
    build:
      context: ./activity-service
    environment:
      SPRING_DATASOURCE_URL: >-
        jdbc:mysql://mysql:3306/campuslink?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: campuslink
      SPRING_DATASOURCE_PASSWORD: campuslink123
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      NACOS_ENABLED: "true"
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_GROUP: CAMPUSLINK_DEV
      MANAGEMENT_SERVER_PORT: 8086
      MANAGEMENT_SERVER_ADDRESS: 0.0.0.0
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      CAMPUSLINK_REDIS_ENABLED: "true"
      CAMPUSLINK_REDIS_ACTIVITY_CATALOG_ENABLED: "true"
      CAMPUSLINK_REDIS_CHECK_IN_RATE_LIMIT_ENABLED: "true"
    depends_on:
      nacos-config:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8083:8083"
    healthcheck:
      test:
        ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8086/actuator/health > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  gateway:
    build:
      context: ./gateway
    environment:
      NACOS_ENABLED: "true"
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_GROUP: CAMPUSLINK_DEV
      MANAGEMENT_SERVER_PORT: 8084
      MANAGEMENT_SERVER_ADDRESS: 0.0.0.0
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    depends_on:
      nacos-config:
        condition: service_completed_successfully
      api:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      activity-service:
        condition: service_healthy
    ports:
      - "127.0.0.1:${CAMPUSLINK_GATEWAY_HOST_PORT:-8081}:8081"
    healthcheck:
      test:
        ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8084/actuator/health > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      - "127.0.0.1:5179:80"

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:16686:16686"

  prometheus:
    image: prom/prometheus:v3.2.1
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - campuslink-prometheus:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:11.5.2
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: campuslink-dev-only
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - campuslink-grafana:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  campuslink-kafka:
  campuslink-mysql:
  campuslink-prometheus:
  campuslink-grafana:
