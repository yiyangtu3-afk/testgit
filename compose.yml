name: campuslink

services:
  kafka:
    image: apache/kafka:3.9.0
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    ports:
      - "9094:9094"
    volumes:
      - campuslink-kafka:/var/lib/kafka/data
    healthcheck:
      test:
        ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: campuslink
      MYSQL_USER: campuslink
      MYSQL_PASSWORD: campuslink123
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - campuslink-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    build:
      context: ./backend
    environment:
      SPRING_DATASOURCE_URL: >-
        jdbc:mysql://mysql:3306/campuslink?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: campuslink
      SPRING_DATASOURCE_PASSWORD: campuslink123
      SPRING_PROFILES_ACTIVE: eventing
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CAMPUSLINK_EVENTING_NOTIFICATION_PROJECTION_ENABLED: "false"
    depends_on:
      kafka:
        condition: service_healthy
      mysql:
        condition: service_healthy
    ports:
      - "${CAMPUSLINK_API_HOST_PORT:-8080}:8080"
    healthcheck:
      test:
        ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8080/api/database/health > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  notification-service:
    build:
      context: ./notification-service
    environment:
      SPRING_DATASOURCE_URL: >-
        jdbc:mysql://mysql:3306/campuslink?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: campuslink
      SPRING_DATASOURCE_PASSWORD: campuslink123
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      api:
        condition: service_healthy
      kafka:
        condition: service_healthy
      mysql:
        condition: service_healthy
    ports:
      - "8082:8082"
    healthcheck:
      test:
        ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8082/actuator/health > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  gateway:
    build:
      context: ./gateway
    environment:
      CAMPUSLINK_API_HTTP_URI: http://api:8080
      CAMPUSLINK_API_WS_URI: ws://api:8080
      CAMPUSLINK_NOTIFICATION_SERVICE_URI: http://notification-service:8082
    depends_on:
      api:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    ports:
      - "8081:8081"
    healthcheck:
      test:
        ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8081/actuator/health > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      - "5179:80"

volumes:
  campuslink-kafka:
  campuslink-mysql:
