groups:
  - name: campuslink-redis
    rules:
      - record: campuslink:redis:application_errors:increase5m
        expr: >-
          sum(increase(campuslink_redis_activity_catalog_cache_error_total[5m]))
          + sum(increase(campuslink_redis_check_in_rate_limit_error_total[5m]))
          + sum(increase(campuslink_redis_registration_idempotency_error_total[5m]))
      - alert: CampusLinkRedisExporterDown
        expr: up{job="redis"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Redis Exporter is unavailable
          description: Prometheus has not scraped the internal Redis Exporter for two minutes.
      - alert: CampusLinkRedisApplicationErrors
        expr: campuslink:redis:application_errors:increase5m > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Redis operations are failing in CampusLink
          description: Cache, check-in rate-limit, or registration idempotency errors persisted for five minutes.
