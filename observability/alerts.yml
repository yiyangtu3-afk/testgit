groups:
  - name: campuslink-redis
    rules:
      - record: campuslink:redis:application_errors:increase1m
        expr: >-
          sum(increase(campuslink_redis_activity_catalog_cache_error_total[1m]))
          + sum(increase(campuslink_redis_check_in_rate_limit_error_total[1m]))
          + sum(increase(campuslink_redis_activity_registration_rate_limit_error_total[1m]))
          + sum(increase(campuslink_redis_registration_idempotency_error_total[1m]))
          + sum(increase(campuslink_redis_auth_rate_limit_error_total[1m]))
      - alert: CampusLinkRedisExporterDown
        expr: up{job="redis"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Redis Exporter is unavailable
          description: Prometheus has not scraped the internal Redis Exporter for two minutes.
      - alert: CampusLinkRedisServerDown
        expr: redis_up{job="redis"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Redis is unavailable behind the Exporter
          description: The Redis Exporter can be scraped but has not reached Redis for two minutes.
      - alert: CampusLinkRedisApplicationErrors
        expr: campuslink:redis:application_errors:increase1m > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Redis operations are failing in CampusLink
          description: Cache, activity registration, check-in, or authentication rate-limit, or registration idempotency errors continued for five minutes.
