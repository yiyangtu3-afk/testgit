global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: campuslink-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["gateway:8084"]
  - job_name: campuslink-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api:8085"]
  - job_name: campuslink-activity-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["activity-service:8086"]
  - job_name: campuslink-notification-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["notification-service:8087"]
  - job_name: nacos
    metrics_path: /nacos/actuator/prometheus
    static_configs:
      - targets: ["nacos:8848"]
