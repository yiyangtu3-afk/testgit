server:
  port: 8083
spring:
  application:
    name: campuslink-activity-service
  config:
    import: optional:nacos:${spring.application.name}.yaml?group=${NACOS_GROUP:CAMPUSLINK_DEV}&refreshEnabled=true
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      discovery:
        enabled: ${NACOS_ENABLED:false}
        group: ${NACOS_GROUP:CAMPUSLINK_DEV}
        health-indicator:
          enabled: true
      config:
        enabled: ${NACOS_ENABLED:false}
        group: ${NACOS_GROUP:CAMPUSLINK_DEV}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/campuslink?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${SPRING_DATASOURCE_USERNAME:campuslink}
    password: ${SPRING_DATASOURCE_PASSWORD:campuslink123}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:127.0.0.1}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      connect-timeout: ${SPRING_DATA_REDIS_CONNECT_TIMEOUT:200ms}
      timeout: ${SPRING_DATA_REDIS_TIMEOUT:200ms}
mybatis:
  configuration:
    map-underscore-to-camel-case: true
management:
  health:
    redis:
      enabled: ${campuslink.redis.activity-catalog.enabled:false}
  server:
    port: ${MANAGEMENT_SERVER_PORT:8086}
    address: ${MANAGEMENT_SERVER_ADDRESS:127.0.0.1}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://127.0.0.1:4318/v1/traces}
campuslink:
  redis:
    activity-catalog:
      enabled: ${CAMPUSLINK_REDIS_ACTIVITY_CATALOG_ENABLED:false}
  security:
    jwt:
      secret: ${CAMPUSLINK_JWT_SECRET:campuslink-demo-signing-secret-change-in-production-2026}
