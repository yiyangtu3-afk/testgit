campuslink:
  operational:
    config-version: "2026.07.27.5"
  redis:
    enabled: true
    activity-catalog:
      enabled: true
      ttl: 2m
      ttl-jitter: 15s
      load-lock-ttl: 5s
      load-lock-retry-delay: 25ms
      load-lock-retries: 4
    check-in-rate-limit:
      enabled: true
      credential-limit: 5
      verification-limit: 10
      window: 1m
    registration-idempotency:
      enabled: true
      processing-ttl: 30s
      result-ttl: 24h

spring:
  data:
    redis:
      host: redis
      port: 6379
      connect-timeout: 200ms
      timeout: 200ms

management:
  endpoint:
    health:
      show-components: never
